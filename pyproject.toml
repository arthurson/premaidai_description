[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "premaidai-description"
version = "0.1.0"
description = "PreMaid AI humanoid: URDF, MuJoCo MJCF (sensors, keyframes, cameras), meshes and loaders"
readme = "python/README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "arthurson" }]
keywords = ["robotics", "humanoid", "urdf", "mjcf", "mujoco", "premaid"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License", "Topic :: Scientific/Engineering"]
dependencies = []

[project.optional-dependencies]
mujoco = ["mujoco>=3.1"]
urdf = ["yourdfpy", "trimesh", "pycollada"]
pybullet = ["pybullet"]

[project.urls]
Homepage = "https://github.com/arthurson/premaidai_description"
Issues = "https://github.com/arthurson/premaidai_description/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/premaidai_description"]

[tool.hatch.build.targets.wheel.force-include]
"meshes" = "premaidai_description/meshes"
"urdf" = "premaidai_description/urdf"
"robots" = "premaidai_description/robots"
"mujoco/premaidai.xml" = "premaidai_description/mujoco/premaidai.xml"
"LICENSE" = "premaidai_description/LICENSE"

[tool.hatch.build.targets.sdist]
include = ["python", "meshes", "urdf", "robots", "mujoco/premaidai.xml", "LICENSE", "pyproject.toml"]
